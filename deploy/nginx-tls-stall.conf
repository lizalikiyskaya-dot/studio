# Обрыв скачивания после первого TLS-куска (~16 КБ).
#
# Наблюдение: несжатый ответ больше ~16 КБ останавливается около 16 004 байт
# и не докачивается. Маленький ответ, gzip и короткий Range приходят.
# 16 КБ — размер TLS-записи nginx по умолчанию (ssl_buffer_size 16k).
# Заголовки ответа съедают несколько сотен байт, поэтому тело обрывается
# чуть раньше 16 384.
#
# Этот файл сам по себе ничего не включает. Деплой его не подкладывает:
# пользователь деплоя не root, а неверный reload nginx положит сайт.
# Фрагмент нужно вписать в server { } студии и лендинга и проверить
# `sudo nginx -t` до reload. Модуль brotli есть не в каждой сборке nginx:
# блок brotli включайте только если `nginx -V` содержит ngx_brotli.

# Меньше одной дейтаграммы на путях, где большой TLS-кусок теряется.
# 4k уже обходит обрыв на 16 КБ. 1400 — если путь режет и более мелкие пакеты.
ssl_buffer_size 4k;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;

# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
