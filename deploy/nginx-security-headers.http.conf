# Карта заголовков, которые сейчас ставит nginx студии.
# Кладётся в http { }, не в server { }. На Ubuntu это файл в
# /etc/nginx/conf.d/ — каталог уже подключается из nginx.conf.
# Сама по себе карта ничего не отправляет браузеру. Её читает
# deploy/nginx-security-headers.server.conf внутри server студии.
# Лендинг эти переменные не использует, его ответы не меняются.

map $uri $studio_x_frame_options {
    default "DENY";
    # Файл методички. Скачивание и превью (?inline=1) идут по одному пути.
    # SAMEORIGIN пускает iframe только с этого же сайта.
    ~^/api/guides/[^/]+/file$ "SAMEORIGIN";
}

map $uri $studio_frame_ancestors {
    default "'none'";
    ~^/api/guides/[^/]+/file$ "'self'";
}
