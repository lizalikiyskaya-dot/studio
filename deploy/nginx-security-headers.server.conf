# Заголовки HTTPS-виртуального хоста студии (studio.lizalikiyskaya.ru).
#
# Откуда они сейчас. В репозитории этих строк нет: ни next.config.ts,
# ни middleware, ни история git. На живом сайте их отдаёт nginx.
# Проверка: ответ 400 «Request Header Or Cookie Too Large» nginx
# собирает сам, до приложения, и в нём уже есть тот же набор
# X-Frame-Options / Content-Security-Policy. Порт 80 и лендинг
# lizalikiyskaya.ru этот набор не шлют — их не трогать.
#
# Этот файл вставляется в server { } студии на 443 вместо нынешних
# add_header с тем же смыслом. Рядом со старыми строками его не
# оставлять: два Content-Security-Policy браузер складывает, и старый
# frame-src 'none' снова запретит превью.
# Перед этим в http { } должен быть deploy/nginx-security-headers.http.conf.
# Без карты переменные пустые, и защита от встраивания пропадёт.
#
# Деплой файл не применяет. После правки:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Было на всех ответах, включая /api/guides/<id>/file?inline=1:
#   X-Frame-Options: DENY
#   Content-Security-Policy: default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'
#
# Стало для страниц (чужой сайт по-прежнему не может встроить студию):
#   X-Frame-Options: DENY
#   frame-ancestors 'none'
#   frame-src 'self'   — страница может открыть iframe только со своего сайта
#
# Стало для /api/guides/<id>/file (превью PDF в GuideReader):
#   X-Frame-Options: SAMEORIGIN
#   frame-ancestors 'self'
#   frame-src 'self'

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $studio_x_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors $studio_frame_ancestors; form-action 'self'; object-src 'none'; frame-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
